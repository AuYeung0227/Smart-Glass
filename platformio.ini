; PlatformIO Project Configuration File
;
;   Build options: build flags, source build environment
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags =
    --before=default_reset
    --after=hard_reset
    --chip=esp32s3
board_build.partitions = partitions_ota.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = spiffs
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_LOOP_STACK_SIZE=32768
    -DCONFIG_BT_BTC_TASK_STACK_SIZE=8192
    -DCONFIG_BTDM_CTRL_HCI_MODE_VHCI=1
; 必须写死端口：本机有 4 个蓝牙虚拟串口(COM4/5/9/10)，自动选口会抓到它们并报 write timeout。
; XIAO 实际枚举为 VID_303A&PID_1001，与板卡 json 的 hwids(2886:0056) 不匹配，故自动选口不可靠。
; 换 USB 口后端口号可能变化，用 `pio device list` 核对。


[env:seeed_xiao_esp32s3_slow]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 57600
upload_flags =
    --before=default_reset
    --after=hard_reset
    --chip=esp32s3
board_build.partitions = partitions_ota.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = spiffs
build_flags =
    -DCORE_DEBUG_LEVEL=5
    -DBOARD_HAS_PSRAM
    -DARDUINO_LOOP_STACK_SIZE=32768
    -DCONFIG_BT_BTC_TASK_STACK_SIZE=8192
    -DCONFIG_BTDM_CTRL_HCI_MODE_VHCI=1
